services:
  # PostgreSQL with ParadeDB (includes pgvector and pg_search extensions)
  postgres:
    image: paradedb/paradedb:latest-pg17
    container_name: rag-admin-postgres
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ragadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ragadmin
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Persistent data storage
      - postgres_data:/var/lib/postgresql/data
      # Database initialization script
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragadmin -d ragadmin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-admin-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      # Persistent document storage
      - document_storage:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Internal web server: serves the React SPA and proxies /api to the backend.
  # TLS and public ports are owned by the standalone edge Caddy (see /opt/edge);
  # this container is reached only over the shared `edge` network by container name.
  web:
    image: caddy:2-alpine
    container_name: rag-admin-web
    restart: unless-stopped
    volumes:
      # Caddy configuration (HTTP-only :80, no TLS)
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Frontend static files (built locally, copied to VPS)
      - ./frontend/dist:/srv:ro
      # Logs
      - caddy_logs:/var/log/caddy
    networks:
      - app-network   # reach the backend
      - edge          # receive traffic from the edge Caddy
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge

  # Shared reverse-proxy network created by the standalone edge stack (/opt/edge).
  # Bring the edge stack up first so this network exists.
  edge:
    external: true
    name: edge

volumes:
  # PostgreSQL data persistence
  postgres_data:
    driver: local

  # Document storage (uploaded files)
  document_storage:
    driver: local

  # Web server logs (cert/config volumes moved to the edge stack)
  caddy_logs:
    driver: local
